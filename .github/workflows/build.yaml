name: Release SDWEAK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0)'
        required: true
        type: string
        default: 'v2.0.0'
      release_notes:
        description: 'Release notes'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute release name
        id: meta
        run: |
          TAG="${{ inputs.version }}"
          SHORT="${TAG%.*}"
          echo "release_name=SDWEAK ${SHORT}" >> $GITHUB_OUTPUT

      - name: Package repository
        run: |
          cp -a . /tmp/SDWEAK
          rm -rf /tmp/SDWEAK/.git \
                 /tmp/SDWEAK/.github \
                 /tmp/SDWEAK/desktop-install.sh \
                 /tmp/SDWEAK/SDWEAK-installer.desktop \
                 /tmp/SDWEAK/assets/logo.png
          cd /tmp
          zip -r "$GITHUB_WORKSPACE/SDWEAK.zip" SDWEAK

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: SDWEAK.zip
          tag_name: ${{ inputs.version }}
          name: ${{ steps.meta.outputs.release_name }}
          body: ${{ inputs.release_notes }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
